<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Performance optimization -->
  <meta name="theme-color" content="#F3F5F1">
  <meta name="color-scheme" content="light dark">
  
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Adel Azzi builds Flutter apps with Django backends and studies software engineering at Innopolis University. Projects, career path and contact.">
  <meta name="keywords" content="Adel Azzi, Full Stack Developer, HPC, High Performance Computing, Portfolio, Web Development, Flutter, Software Engineer">
  <meta name="author" content="Adel Azzi">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Adel Azzi - Full Stack Developer Portfolio">
  <meta property="og:description" content="Flutter and Django developer, master's student in software engineering at Innopolis University.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://adelazzi.github.io/My_Portfolio/icons/Icon-512.png">
  <meta property="og:url" content="https://adelazzi.github.io/My_Portfolio/">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Adel Azzi - Full Stack Developer Portfolio">
  <meta name="twitter:description" content="Flutter and Django developer, master's student in software engineering at Innopolis University.">
  <meta name="twitter:image" content="https://adelazzi.github.io/My_Portfolio/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Adel Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Adel Azzi - Full Stack Developer Portfolio</title>
  <link rel="manifest" href="manifest.json">
  <link rel="canonical" href="https://adelazzi.github.io/My_Portfolio/">

  <style>
    body { margin: 0; background: #F3F5F1; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: system-ui, sans-serif; color: #14201A;
    }
    #splash .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid #C9D3CB; border-top-color: #02522F;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .spinner { animation: none; } }
  </style>
  
</head>
<body>
  <div id="splash" aria-live="polite">
    <div class="spinner"></div>
    <h1 style="margin:0;font-size:20px;font-weight:600;">Adel Azzi</h1>
    <p style="margin:0;font-size:14px;color:#55665B;">Flutter and Django developer. Loading&hellip;</p>
  </div>
  <noscript>
    <p>Adel Azzi, Flutter and Django developer, master's student in software engineering at Innopolis University.
      This portfolio needs JavaScript. Find me on
      <a href="https://github.com/adelazzi">GitHub</a> and
      <a href="https://www.linkedin.com/in/adel-azzi-99649933b/">LinkedIn</a>.</p>
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
