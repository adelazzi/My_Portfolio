name: my_portfolio
description: Portfolio of Adel Azzi, Flutter and Django developer.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.1.11
  http: ^0.13.6
  get: ^4.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/logo.jpg"
    background_color: "#8B4513"
    theme_color: "#8B4513"
  remove_alpha_ios: true
  image_path: "assets/logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/projects/
    - assets/portfolio/
    - assets/translations/

  fonts:
    - family: PlexSans
      fonts:
        - asset: assets/fonts/plex/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/plex/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plex/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: PlexCondensed
      fonts:
        - asset: assets/fonts/plex/IBMPlexSansCondensed-SemiBold.ttf
          weight: 600
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/plex/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/plex/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/plex/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
